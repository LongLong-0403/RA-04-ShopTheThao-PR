<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Lý Đơn Hàng & In Hóa Đơn | Tsport Store Admin</title>
    <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body data-root="../">

  <!-- KHU VỰC IN HÓA ĐƠN @MEDIA PRINT -->
  <div id="invoicePrintArea" class="print-only"></div>

  <div class="tsport-admin-wrapper no-print">
    <!-- BACKDROP MOBILE -->
    <div class="tsport-sidebar-backdrop" id="adminSidebarBackdrop"></div>

    <!-- SIDEBAR DÙNG CHUNG -->
    <aside class="tsport-admin-sidebar" id="adminSidebar"></aside>

    <!-- MAIN BODY -->
    <div class="tsport-admin-main">
      <header class="tsport-admin-topbar">
        <div class="tsport-admin-topbar-left">
          <button type="button" class="tsport-hamburger-btn" id="btnToggleAdminSidebar" aria-label="Mở menu">☰</button>
          <div>
            <h1 style="font-size:18px; font-weight:800; margin:0; color:#0F172A;">📑 Quản Lý Đơn Hàng &amp; In Phiếu Xuất Kho</h1>
            <div style="font-size:12px; color:#64748B;">Chuyển trạng thái theo luồng, kiểm soát hoàn tồn kho tự động</div>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <a href="orders.html" class="btn btn-secondary btn-sm" target="_blank">👁️ Xem trang Khách</a>
          <a href="../index.html" class="btn btn-secondary btn-sm">🏠 Về Cửa Hàng</a>
        </div>
      </header>

      <div class="tsport-admin-body">
        
        <!-- CARD DANH SÁCH ĐƠN HÀNG -->
        <div class="tsport-card">
          <div class="tsport-filter-bar">
            <div class="tsport-filter-search">
              <span class="tsport-filter-search-icon">🔍</span>
              <input type="text" id="adminOrderSearch" placeholder="Tìm theo mã đơn (ORD-...), tên khách, SĐT..." />
            </div>

            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button type="button" class="btn btn-secondary btn-sm js-filter-order-status is-active" data-status="ALL">Tất cả</button>
              <button type="button" class="btn btn-secondary btn-sm js-filter-order-status" data-status="PENDING">⏳ Chờ duyệt</button>
              <button type="button" class="btn btn-secondary btn-sm js-filter-order-status" data-status="CONFIRMED">✓ Đã xác nhận</button>
              <button type="button" class="btn btn-secondary btn-sm js-filter-order-status" data-status="SHIPPING">🚚 Đang giao</button>
              <button type="button" class="btn btn-secondary btn-sm js-filter-order-status" data-status="COMPLETED">★ Hoàn tất</button>
              <button type="button" class="btn btn-secondary btn-sm js-filter-order-status" data-status="CANCELLED">✕ Đã hủy</button>
            </div>

            <div class="tsport-filter-count" id="adminOrdersCountBadge">0 đơn hàng</div>
          </div>

          <div class="tsport-table-responsive">
            <table class="tsport-table">
              <thead>
                <tr>
                  <th>Mã đơn / Ngày</th>
                  <th>Khách hàng &amp; Địa chỉ</th>
                  <th>Chi tiết</th>
                  <th>Tổng tiền</th>
                  <th>Trạng thái</th>
                  <th style="min-width:160px;">Chuyển trạng thái</th>
                  <th style="width:90px; text-align:center;">In phiếu</th>
                </tr>
              </thead>
              <tbody id="adminOrdersTbody">
                <tr><td colspan="7" style="text-align:center; padding:20px;">Đang tải danh sách đơn hàng...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- SCRIPTS -->
  <script src="../js/data/mock-data.js"></script>
  <script src="../js/data/store.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/modules/admin-nav.js"></script>
  <script src="../js/modules/admin-orders.js"></script>
</body>
</html>
